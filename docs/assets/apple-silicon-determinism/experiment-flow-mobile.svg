<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 360 930">
  <title id="title">Prospective model-free MLX experiment flow on a narrow screen</title>
  <desc id="desc">The current project predeclares the primitive matrix and stops at an ungranted human authorization gate. Future bounded execution, parent validation, and evidence-atlas stages are inactive. Zero physical observations are accepted, and every mismatch fails closed.</desc>

  <rect width="360" height="930" fill="#07111f"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="20" y="35" fill="#f8fbff" font-size="24" font-weight="700">Measure primitives first</text>
    <text x="20" y="62" fill="#c2cee3" font-size="16">Declare conditions before any action.</text>

    <rect x="18" y="88" width="324" height="150" rx="14" fill="#123049" stroke="#6ee7f5" stroke-width="3"/>
    <text x="38" y="122" fill="#8cf4ff" font-size="16" font-weight="700">CURRENT PROJECT</text>
    <text x="38" y="156" fill="#ffffff" font-size="24" font-weight="700">Matrix only</text>
    <text x="38" y="188" fill="#d8e8f4" font-size="17">Conditions are predeclared.</text>
    <text x="38" y="216" fill="#d8e8f4" font-size="17">No import. No Metal. No tensors.</text>

    <path d="M180 245V269" stroke="#77dfee" stroke-width="4" stroke-linecap="round"/>
    <path d="M171 260L180 271L189 260" fill="none" stroke="#77dfee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="18" y="278" width="324" height="178" rx="14" fill="#2b2020" stroke="#f2bd57" stroke-width="4"/>
    <path d="M53 372V350C53 322 73 309 92 309C111 309 131 322 131 350V372" fill="none" stroke="#ffe29a" stroke-width="8" stroke-linecap="round"/>
    <rect x="40" y="364" width="104" height="70" rx="10" fill="#52391b" stroke="#f2bd57" stroke-width="3"/>
    <text x="165" y="316" fill="#ffd477" font-size="16" font-weight="700">HUMAN GATE</text>
    <text x="165" y="351" fill="#ffffff" font-size="24" font-weight="700">NOT GRANTED</text>
    <text x="165" y="384" fill="#fff1c2" font-size="18" font-weight="700">STOP. No run.</text>
    <text x="165" y="414" fill="#f2dfbd" font-size="16">Fresh decision required.</text>
    <text x="38" y="442" fill="#ffffff" font-size="18" font-weight="700">The project stops here today.</text>

    <path d="M180 463V487" stroke="#687896" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>
    <path d="M171 478L180 489L189 478" fill="none" stroke="#687896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="18" y="496" width="324" height="244" rx="14" fill="#151d2c" stroke="#687896" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="38" y="531" fill="#d7e0f2" font-size="20" font-weight="700">Future stages are inactive</text>
    <path d="M38 549H322" stroke="#33425f" stroke-width="2"/>
    <text x="38" y="582" fill="#f0f4fb" font-size="18" font-weight="700">Bounded execution</text>
    <text x="322" y="582" fill="#aab8d3" font-size="16" font-weight="700" text-anchor="end">INACTIVE</text>
    <text x="38" y="625" fill="#f0f4fb" font-size="18" font-weight="700">Parent validation</text>
    <text x="322" y="625" fill="#aab8d3" font-size="16" font-weight="700" text-anchor="end">INACTIVE</text>
    <text x="38" y="668" fill="#f0f4fb" font-size="18" font-weight="700">Evidence atlas</text>
    <text x="322" y="668" fill="#aab8d3" font-size="16" font-weight="700" text-anchor="end">INACTIVE</text>
    <rect x="38" y="692" width="284" height="34" rx="17" fill="#211925" stroke="#ff8f9b" stroke-width="2"/>
    <text x="180" y="715" fill="#ffd1d6" font-size="17" font-weight="700" text-anchor="middle">0 physical observations accepted</text>

    <path d="M180 747V771" stroke="#ff7f8d" stroke-width="4" stroke-linecap="round"/>
    <path d="M171 762L180 773L189 762" fill="none" stroke="#ff7f8d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="18" y="780" width="324" height="116" rx="14" fill="#3b1924" stroke="#ff7f8d" stroke-width="3"/>
    <text x="38" y="818" fill="#ffffff" font-size="21" font-weight="700">Any mismatch → refusal</text>
    <text x="38" y="850" fill="#ffd1d6" font-size="16">Retain the failure. Retry count: 0.</text>
    <text x="38" y="878" fill="#ffd1d6" font-size="16">No replacement or selective rerun.</text>

    <text x="180" y="920" fill="#c2cee3" font-size="16" font-weight="700" text-anchor="middle">Prospective. Model-free. No timing.</text>
  </g>
</svg>
