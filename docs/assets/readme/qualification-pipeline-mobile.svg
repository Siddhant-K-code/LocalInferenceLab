<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 600 1120">
  <title id="title">LocalInferenceLab qualification pipeline on a narrow screen</title>
  <desc id="desc">A vertical five-stage path runs from proposal to static qualification, a human gate, an inactive schema-1.1 execution path, and evidence. The current state stops after static qualification. Missing authority routes to deterministic refusal with no runtime action.</desc>

  <rect width="600" height="1120" fill="#0b1020"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="58" fill="#f7f9ff" font-size="34" font-weight="700">A proof pipeline</text>
    <text x="38" y="94" fill="#b9c6e4" font-size="20">Static coherence can reach review.</text>
    <text x="38" y="120" fill="#b9c6e4" font-size="20">Only new authority can cross into action.</text>

    <rect x="38" y="158" width="524" height="104" rx="12" fill="#17213a" stroke="#7182a8" stroke-width="3"/>
    <text x="62" y="194" fill="#9eb0d5" font-size="17" font-weight="700" letter-spacing="1.5">01 / PROPOSAL</text>
    <text x="62" y="232" fill="#f7f9ff" font-size="28" font-weight="700">Exact candidate bytes + metadata</text>

    <path d="M300 268V298" stroke="#6ee7f5" stroke-width="5" stroke-linecap="round"/>
    <path d="M288 286L300 300L312 286" fill="none" stroke="#6ee7f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="38" y="306" width="524" height="136" rx="12" fill="#123247" stroke="#6ee7f5" stroke-width="4"/>
    <text x="62" y="344" fill="#8cf4ff" font-size="17" font-weight="700" letter-spacing="1.5">02 / STATIC QUALIFICATION</text>
    <text x="62" y="383" fill="#ffffff" font-size="28" font-weight="700">Offline checks + pinned review</text>
    <rect x="62" y="400" width="185" height="27" rx="13.5" fill="#6ee7f5"/>
    <text x="154.5" y="419" fill="#08131b" font-size="14" font-weight="700" text-anchor="middle">CURRENT STOP</text>

    <rect x="38" y="474" width="524" height="104" rx="12" fill="#102a2d" stroke="#5ee0c1" stroke-width="3"/>
    <text x="62" y="511" fill="#84f3da" font-size="17" font-weight="700" letter-spacing="1.5">STATIC DECISION</text>
    <text x="62" y="551" fill="#ffffff" font-size="24" font-weight="700">Eligible for possible fresh review</text>

    <path d="M300 584V614" stroke="#d7a94a" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="M288 602L300 616L312 602" fill="none" stroke="#d7a94a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="38" y="622" width="524" height="104" rx="12" fill="#211c21" stroke="#d7a94a" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="62" y="659" fill="#f1c76c" font-size="17" font-weight="700" letter-spacing="1.5">03 / HUMAN GATE</text>
    <text x="62" y="699" fill="#fff7e5" font-size="28" font-weight="700">Fresh decision not granted</text>

    <path d="M300 732V762" stroke="#65718e" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 9"/>
    <path d="M288 750L300 764L312 750" fill="none" stroke="#65718e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="38" y="770" width="252" height="104" rx="12" fill="#141a2a" stroke="#65718e" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="60" y="807" fill="#95a1bd" font-size="15" font-weight="700">04 / NO ACTIVE PATH</text>
    <text x="60" y="846" fill="#dfe5f3" font-size="23" font-weight="700">Unreachable</text>

    <rect x="310" y="770" width="252" height="104" rx="12" fill="#141a2a" stroke="#65718e" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="332" y="807" fill="#95a1bd" font-size="17" font-weight="700">05 / EVIDENCE</text>
    <text x="332" y="846" fill="#dfe5f3" font-size="23" font-weight="700">Not accepted</text>

    <path d="M300 882V920" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round"/>
    <path d="M288 908L300 922L312 908" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="910" fill="#ff9a9a" font-size="17" font-weight="700">missing authority</text>

    <rect x="38" y="930" width="524" height="148" rx="12" fill="#3a1720" stroke="#ff6b6b" stroke-width="4"/>
    <text x="62" y="970" fill="#ff9a9a" font-size="17" font-weight="700" letter-spacing="1.5">DETERMINISTIC REFUSAL</text>
    <text x="62" y="1010" fill="#ffffff" font-size="25" font-weight="700">No install. No import. No Metal query.</text>
    <text x="62" y="1047" fill="#ffffff" font-size="25" font-weight="700">No model. No runtime action.</text>
  </g>
</svg>
