    <text x="110" y="754" fill="#f7f9ff" font-size="26" font-weight="700">0</text>
    <text x="150" y="754" fill="#cbd5eb" font-size="19">accepted physical observations</text>

    <path d="M62 787H538" stroke="#34415f" stroke-width="1"/>
    <text x="62" y="817" fill="#ffcf9b" font-size="18" font-weight="700">No physical MLX or Metal result is accepted.</text>
