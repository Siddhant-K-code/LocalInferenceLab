      <rect x="62" y="286" width="52" height="52" rx="7"/><rect x="122" y="286" width="52" height="52" rx="7"/><rect x="182" y="286" width="52" height="52" rx="7"/><rect x="242" y="286" width="52" height="52" rx="7"/><rect x="302" y="286" width="52" height="52" rx="7"/><rect x="362" y="286" width="52" height="52" rx="7"/><rect x="422" y="286" width="52" height="52" rx="7"/><rect x="482" y="286" width="52" height="52" rx="7"/>
      <rect x="62" y="346" width="52" height="52" rx="7"/><rect x="122" y="346" width="52" height="52" rx="7"/><rect x="182" y="346" width="52" height="52" rx="7"/><rect x="242" y="346" width="52" height="52" rx="7"/><rect x="302" y="346" width="52" height="52" rx="7"/><rect x="362" y="346" width="52" height="52" rx="7"/><rect x="422" y="346" width="52" height="52" rx="7"/><rect x="482" y="346" width="52" height="52" rx="7"/>
      <rect x="62" y="406" width="52" height="52" rx="7"/><rect x="122" y="406" width="52" height="52" rx="7"/><rect x="182" y="406" width="52" height="52" rx="7"/><rect x="242" y="406" width="52" height="52" rx="7"/><rect x="302" y="406" width="52" height="52" rx="7"/><rect x="362" y="406" width="52" height="52" rx="7"/><rect x="422" y="406" width="52" height="52" rx="7"/><rect x="482" y="406" width="52" height="52" rx="7"/>
