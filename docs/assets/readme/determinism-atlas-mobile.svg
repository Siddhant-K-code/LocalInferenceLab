<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 600 900">
  <title id="title">Determinism atlas preview on a narrow screen</title>
  <desc id="desc">A large grid counts 48 prospective operation cells. Eight are represented by synthetic fixtures. No cell contains an accepted physical MLX or Metal observation.</desc>

  <rect width="600" height="900" fill="#0b1020"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="58" fill="#f7f9ff" font-size="32" font-weight="700">A map, not a benchmark</text>
    <text x="38" y="94" fill="#b9c6e4" font-size="19">Comparison slots come before observations.</text>
    <text x="38" y="140" fill="#9eb0d5" font-size="17" font-weight="700" letter-spacing="1.4">48 PROSPECTIVE CELLS</text>

    <g fill="#25314d" stroke="#53617f" stroke-width="2">
      <rect x="62" y="166" width="52" height="52" rx="7"/><rect x="122" y="166" width="52" height="52" rx="7"/><rect x="182" y="166" width="52" height="52" rx="7"/><rect x="242" y="166" width="52" height="52" rx="7"/><rect x="302" y="166" width="52" height="52" rx="7"/><rect x="362" y="166" width="52" height="52" rx="7"/><rect x="422" y="166" width="52" height="52" rx="7"/><rect x="482" y="166" width="52" height="52" rx="7"/>
