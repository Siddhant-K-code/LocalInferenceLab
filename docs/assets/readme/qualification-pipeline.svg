<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 620">
  <title id="title">LocalInferenceLab qualification pipeline</title>
  <desc id="desc">A five-stage path runs from proposal to static qualification, a human gate, bounded custody, and evidence. The current state stops after static qualification. Missing authority or any mismatch routes to deterministic refusal with no runtime action.</desc>

  <rect width="1200" height="620" fill="#0b1020"/>
  <path d="M0 118H1200M0 482H1200" stroke="#26314d" stroke-width="1"/>

  <text x="60" y="64" fill="#f7f9ff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">A proof pipeline with a hard stop</text>
  <text x="60" y="96" fill="#b9c6e4" font-family="Arial, Helvetica, sans-serif" font-size="19">Static coherence can reach review. Only new authority can cross into action.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="45" y="172" width="190" height="132" rx="12" fill="#17213a" stroke="#7182a8" stroke-width="2"/>
    <text x="65" y="207" fill="#9eb0d5" font-size="14" font-weight="700" letter-spacing="1.5">01 / PROPOSAL</text>
    <text x="65" y="242" fill="#f7f9ff" font-size="24" font-weight="700">Exact candidate</text>
    <text x="65" y="272" fill="#c9d3ea" font-size="16">bytes + metadata</text>

    <path d="M243 238H278" stroke="#6ee7f5" stroke-width="4" stroke-linecap="round"/>
    <path d="M269 229L280 238L269 247" fill="none" stroke="#6ee7f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="285" y="154" width="210" height="168" rx="12" fill="#123247" stroke="#6ee7f5" stroke-width="4"/>
    <text x="307" y="190" fill="#8cf4ff" font-size="14" font-weight="700" letter-spacing="1.5">02 / STATIC QUALIFY</text>
    <text x="307" y="226" fill="#ffffff" font-size="24" font-weight="700">Offline checks</text>
    <text x="307" y="257" fill="#d5f9ff" font-size="16">pinned review + closure</text>
    <rect x="307" y="278" width="165" height="25" rx="12.5" fill="#6ee7f5"/>
    <text x="389.5" y="296" fill="#08131b" font-size="13" font-weight="700" text-anchor="middle">CURRENT STOP</text>

    <path d="M503 238H538" stroke="#d7a94a" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 8"/>
    <path d="M529 229L540 238L529 247" fill="none" stroke="#d7a94a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="545" y="172" width="190" height="132" rx="12" fill="#211c21" stroke="#d7a94a" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="565" y="207" fill="#f1c76c" font-size="14" font-weight="700" letter-spacing="1.5">03 / HUMAN GATE</text>
    <text x="565" y="242" fill="#fff7e5" font-size="24" font-weight="700">Fresh decision</text>
    <text x="565" y="272" fill="#eadbbd" font-size="16">not granted</text>

    <path d="M743 238H778" stroke="#65718e" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 9"/>
    <path d="M769 229L780 238L769 247" fill="none" stroke="#65718e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="785" y="172" width="190" height="132" rx="12" fill="#141a2a" stroke="#65718e" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="805" y="207" fill="#95a1bd" font-size="14" font-weight="700" letter-spacing="1.5">04 / CUSTODY</text>
    <text x="805" y="242" fill="#dfe5f3" font-size="24" font-weight="700">Bounded action</text>
    <text x="805" y="272" fill="#aeb9d0" font-size="16">not implemented</text>

    <path d="M983 238H1018" stroke="#65718e" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 9"/>
    <path d="M1009 229L1020 238L1009 247" fill="none" stroke="#65718e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1025" y="172" width="130" height="132" rx="12" fill="#141a2a" stroke="#65718e" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="1045" y="207" fill="#95a1bd" font-size="14" font-weight="700" letter-spacing="1.2">05 / EVIDENCE</text>
    <text x="1045" y="242" fill="#dfe5f3" font-size="22" font-weight="700">Observed</text>
    <text x="1045" y="272" fill="#aeb9d0" font-size="16">not accepted</text>

    <rect x="285" y="354" width="450" height="74" rx="12" fill="#102a2d" stroke="#5ee0c1" stroke-width="2"/>
    <text x="307" y="383" fill="#84f3da" font-size="14" font-weight="700" letter-spacing="1.2">STATIC DECISION</text>
    <text x="307" y="412" fill="#ffffff" font-size="19" font-weight="700">eligible for possible fresh authorization review</text>

    <path d="M390 322V347" stroke="#5ee0c1" stroke-width="4" stroke-linecap="round"/>
    <path d="M381 338L390 349L399 338" fill="none" stroke="#5ee0c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M755 392H800V458" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M791 449L800 460L809 449" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="775" y="378" fill="#ff9a9a" font-size="15" font-weight="700">missing authority</text>

    <rect x="45" y="482" width="1110" height="94" rx="12" fill="#3a1720" stroke="#ff6b6b" stroke-width="3"/>
    <text x="75" y="522" fill="#ff9a9a" font-size="15" font-weight="700" letter-spacing="1.5">DETERMINISTIC REFUSAL</text>
    <text x="75" y="554" fill="#ffffff" font-size="25" font-weight="700">No install. No import. No Metal query. No model. No runtime action.</text>
  </g>
</svg>
